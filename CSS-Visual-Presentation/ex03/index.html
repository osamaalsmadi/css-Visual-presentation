<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exercise 03 - Colors & Transparency</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2>Color Palette</h2>
    <div class="palette-container">
        <div class="swatch named">Named Color</div>
        <div class="swatch hex">6-Digit HEX</div>
        <div class="swatch rgb">RGB Color</div>
        <div class="swatch rgba">RGBA (Alpha)</div>
    </div>
    <h2>Opacity vs RGBA</h2>
    <div class="comparison-container">
        <div class="box box-opacity">
            <p class="box-text">Opacity: 0.5 (Text Faded)</p>
        </div>
        <div class="box box-rgba">
            <p class="box-text">RGBA: 0.5 (Text Solid)</p>
        </div>
    </div>

</body>
</html>
