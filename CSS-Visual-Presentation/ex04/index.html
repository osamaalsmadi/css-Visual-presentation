<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exercise 04 - Box Model</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2>Box Model Comparison</h2>
    
    <div class="container">
        <div class="box content-box">
            <strong>Content-box</strong>
            <p>Width does not include padding and border.</p>
        </div>
        
        <div class="box border-box">
            <strong>Border-box</strong>
            <p>Width includes padding and border.</p>
        </div>
    </div>

</body>
</html>
